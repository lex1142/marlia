name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a folder with …
        2. Press …
        3. …
  - type: dropdown
    id: mode
    attributes:
      label: View mode
      options:
        - List
        - Icons
        - Columns
        - Not specific to a view mode
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: e.g. 15.3
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Marlia version
      description: Marlia ▸ About Marlia
      placeholder: e.g. 1.2
